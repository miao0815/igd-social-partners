<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究人员生成邀请链接</title><link rel="stylesheet" href="style.css"><main class="card"><h1>生成实验邀请链接</h1><p>编号与两份问卷一致。顺序条件由主试分配，在高、低倾向组内分别平衡1—8；不让被试自行选择组别或顺序。</p><form id="f"><label>匿名编号</label><input id="pid" pattern="[0-9]{1,8}" maxlength="8" required><label>顺序条件（1—8）</label><input id="condition" type="number" min="1" max="8" value="1" required><label>运行模式</label><select id="mode"><option value="demo">短版演示：128试次，不上传</option><option value="pilot">完整预测试：384试次，上传</option><option value="formal">正式实验：384试次，上传</option></select><button>生成链接</button></form><p id="out" style="word-break:break-all"></p><a id="go" hidden>打开实验</a><p class="minor">没有DataPipe ID、线上知情同意和开放开关时，预测试及正式入口不会开放。此页不存储分组表。</p></main><script>document.getElementById('f').onsubmit=e=>{e.preventDefault();const u=new URL('index.html',location.href);u.searchParams.set('mode',document.getElementById('mode').value);u.searchParams.set('id',document.getElementById('pid').value);u.searchParams.set('condition',document.getElementById('condition').value);document.getElementById('out').textContent=u.href;const a=document.getElementById('go');a.href=u.href;a.hidden=false;};</script></html>
